publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sensors_plus: ^5.0.1
  geolocator: ^12.0.0
  http: ^1.2.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  cloud_firestore: ^5.0.1
  firebase_core: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
