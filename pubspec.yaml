name: moje_meteo
description: "Meteo aplikacia s barometrom"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^10.1.0
  http: ^1.2.0
  latlong2: ^0.9.1
  sensors_plus: 6.0.0
  flutter_map: ^6.1.0
  webview_flutter: ^4.7.0
  camera: ^0.11.0+2
  image: ^4.2.0
  image_picker: ^1.1.2

  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/cloud_classifier.tflite
